<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Bank Sampah Sekolah</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: #e8f5e9;
            margin: 0;
            padding: 20px;
        }

        h1 { color: #2e7d32; }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 200px;
            border-top: 5px solid #4caf50;
        }

        .category-icon { font-size: 40px; }
        
        .weight {
            font-size: 35px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }

        .label { color: #666; margin-bottom: 10px; }

        button {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4caf50;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #45a049; }

        .summary {
            background: white;
            margin: 30px auto;
            padding: 20px;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .total-saldo {
            font-size: 24px;
            color: #2e7d32;
            font-weight: bold;
        }

        .reset {
            background: #f44336;
            margin-top: 20px;
        }

        .reset:hover { background: #d32f2f; }
    </style>
</head>
<body>

    <h1>🌿 Bank Sampah Sekolah</h1>
    <p>Mari menabung sambil menjaga lingkungan!</p>

    <div class="container">
        <div class="box">
            <div class="category-icon">🥤</div>
            <h3>Plastik</h3>
            <div class="label">Rp 2.000 / kg</div>
            <div class="weight"><span id="berat-plastik">0</span> kg</div>
            <button onclick="tambahSampah('plastik', 1)">+ 1kg</button>
        </div>

        <div class="box">
            <div class="category-icon">📄</div>
            <h3>Kertas</h3>
            <div class="label">Rp 1.500 / kg</div>
            <div class="weight"><span id="berat-kertas">0</span> kg</div>
            <button onclick="tambahSampah('kertas', 1)">+ 1kg</button>
        </div>

        <div class="box">
            <div class="category-icon">🥫</div>
            <h3>Logam</h3>
            <div class="label">Rp 4.000 / kg</div>
            <div class="weight"><span id="berat-logam">0</span> kg</div>
            <button onclick="tambahSampah('logam', 1)">+ 1kg</button>
        </div>
    </div>

    <div class="summary">
        <h2>Ringkasan Tabungan</h2>
        <p>Total Berat: <strong><span id="total-berat">0</span> kg</strong></p>
        <div class="total-saldo">Saldo: Rp <span id="total-harga">0</span></div>
        <button class="reset" onclick="reset()">Reset Data</button>
    </div>

    <script>
        // Data harga per kg
        const harga = {
            plastik: 2000,
            kertas: 1500,
            logam: 4000
        };

        // State data
        let data = {
            plastik: 0,
            kertas: 0,
            logam: 0
        };

        function tambahSampah(jenis, jumlah) {
            data[jenis] += jumlah;
            document.getElementById(`berat-${jenis}`).innerText = data[jenis];
            updateTotal();
        }

        function updateTotal() {
            const totalBerat = data.plastik + data.kertas + data.logam;
            const totalHarga = (data.plastik * harga.plastik) + 
                               (data.kertas * harga.kertas) + 
                               (data.logam * harga.logam);

            document.getElementById("total-berat").innerText = totalBerat;
            document.getElementById("total-harga").innerText = totalHarga.toLocaleString('id-ID');
        }

        function reset() {
            if(confirm("Apakah Anda yakin ingin menghapus semua catatan?")) {
                data.plastik = 0;
                data.kertas = 0;
                data.logam = 0;
                
                document.getElementById("berat-plastik").innerText = 0;
                document.getElementById("berat-kertas").innerText = 0;
                document.getElementById("berat-logam").innerText = 0;
                updateTotal();
            }
        }
    </script>
</body>
</html>
