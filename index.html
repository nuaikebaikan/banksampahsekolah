<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hitung Karung Paket</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f2f2f2;
}

.container{
    display:flex;
    justify-content:center;
    gap:50px;
    margin-top:50px;
}

.box{
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.count{
    font-size:40px;
    margin:20px 0;
}

button{
    font-size:30px;
    padding:10px 25px;
    border:none;
    border-radius:10px;
    background:#4CAF50;
    color:white;
}

.reset{
    margin-top:40px;
    background:red;
    font-size:20px;
}
</style>
</head>

<body>

<h1>Hitung Karung Paket</h1>

<div class="container">

<div class="box">
<h2>Luar</h2>
<div class="count" id="kiri">0</div>
<button onclick="tambahKiri()">+</button>
</div>

<div class="box">
<h2>Dalam</h2>
<div class="count" id="kanan">0</div>
<button onclick="tambahKanan()">+</button>
</div>

</div>

<br>

<h2>Total: <span id="total">0</span></h2>

<button class="reset" onclick="reset()">RESET</button>

<script>
let kiri = 0;
let kanan = 0;

function tambahKiri(){
    kiri++;
    document.getElementById("kiri").innerText = kiri;
    updateTotal();
}

function tambahKanan(){
    kanan++;
    document.getElementById("kanan").innerText = kanan;
    updateTotal();
}

function updateTotal(){
    document.getElementById("total").innerText = kiri + kanan;
}

function reset(){
    kiri = 0;
    kanan = 0;
    document.getElementById("kiri").innerText = 0;
    document.getElementById("kanan").innerText = 0;
    updateTotal();
}
</script>

</body>
  </html>
