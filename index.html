<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bank Sampah Sekolah</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#22a35a;
    }

    .app{
      max-width:420px;
      margin:auto;
      min-height:100vh;
      background:#f5f5f5;
    }

    .header{
      background:#22a35a;
      color:white;
      padding:25px 20px;
    }

    .logo{
      font-size:38px;
      font-weight:bold;
    }

    .sub{
      font-size:18px;
      margin-top:5px;
    }

    .card-user{
      background:white;
      margin:20px;
      border-radius:20px;
      padding:20px;
      display:flex;
      align-items:center;
      gap:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .avatar{
      width:70px;
      height:70px;
      border-radius:50%;
      background:#dff5e8;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:35px;
    }

    .username{
      font-size:30px;
      font-weight:bold;
    }

    .desc{
      color:gray;
      margin-top:5px;
    }

    .point-box{
      background:white;
      margin:20px;
      border-radius:20px;
      padding:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .point-title{
      font-size:28px;
      font-weight:bold;
    }

    .point{
      font-size:70px;
      font-weight:bold;
      margin:15px 0;
    }

    .btn{
      background:#22a35a;
      color:white;
      border:none;
      width:100%;
      padding:15px;
      border-radius:15px;
      font-size:22px;
      cursor:pointer;
    }

    .menu{
      margin:20px;
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .menu-item{
      background:white;
      border-radius:20px;
      padding:20px;
      display:flex;
      align-items:center;
      gap:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .icon{
      width:70px;
      height:70px;
      border-radius:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:35px;
      color:white;
    }

    .blue{
      background:#4b8df8;
    }

    .red{
      background:#e84d5b;
    }

    .orange{
      background:#f4a340;
    }

    .menu-text h3{
      font-size:28px;
    }

    .menu-text p{
      color:gray;
      margin-top:5px;
    }

    .navbar
